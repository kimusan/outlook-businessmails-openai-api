<!doctype html>
<html lang="en" data-framework="typescript">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self' 'unsafe-inline'; img-src * data: blob:; connect-src *; frame-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Outlook AI Result</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f6f8fb;
      color: #111827;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .dialog-root {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .dialog-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: #ffffff;
      border-bottom: 1px solid #d1d5db;
    }

    .dialog-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .dialog-meta {
      margin: 4px 0 0;
      font-size: 12px;
      color: #4b5563;
    }

    /* Live-translation progress ("Translating… 45% (part 3/7)") — highlighted
       pill so progress is visible at a glance. */
    .dialog-meta.is-live {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      color: #1e3a8a;
      background: #eef6ff;
      border: 1px solid #bfd4f5;
      border-radius: 999px;
      padding: 5px 12px;
    }

    .dialog-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dialog-button {
      border: 1px solid #c7d2fe;
      background: #eef2ff;
      color: #1e3a8a;
      font-size: 13px;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .dialog-button:hover {
      background: #e0e7ff;
    }

    .dialog-content {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }

    .dialog-markup {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 16px;
      white-space: pre-wrap;
    }

    .dialog-markup h2,
    .dialog-markup h3,
    .dialog-markup h4 {
      margin: 14px 0 8px;
      color: #111827;
    }

    .dialog-markup h2 {
      font-size: 20px;
    }

    .dialog-markup h3 {
      font-size: 17px;
    }

    .dialog-markup h4 {
      font-size: 15px;
    }

    .dialog-markup p {
      margin: 8px 0;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .dialog-markup ul {
      margin: 6px 0 10px 22px;
      padding: 0;
    }

    .dialog-markup li {
      margin: 4px 0;
      line-height: 1.45;
    }

    .dialog-markup a {
      color: #1d4ed8;
      text-decoration: underline;
    }

    .dialog-markup .fmt-spacer {
      height: 10px;
    }

    .dialog-status {
      font-size: 12px;
      color: #6b7280;
      margin-left: 10px;
    }

    /* --- live translated view (read mode) --- */

    .dialog-notes {
      background: #eef6ff;
      border: 1px solid #bfd4f5;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 12.5px;
      color: #1e3a8a;
    }

    .dialog-notes p {
      margin: 2px 0;
    }

    .dialog-subject {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 12px;
      color: #111827;
    }

    /* The mail copy renders the adopted body element: mail HTML brings its
       own block structure, so the AI-text typography rules do not apply. */
    .dialog-markup.mail-view {
      white-space: normal;
      padding: 0;
      border: 0;
      background: #ffffff;
    }

    .dialog-markup.mail-view > body {
      display: block;
      margin: 0;
      padding: 16px;
    }

    @keyframes translate-fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes translate-flash {
      0%,
      25% {
        background-color: rgba(100, 149, 237, 0.3);
        box-shadow: 0 0 0 2px rgba(100, 149, 237, 0.22);
      }
      100% {
        background-color: transparent;
        box-shadow: 0 0 0 2px transparent;
      }
    }

    .translate-flash {
      animation: translate-fade-in 0.5s ease-out, translate-flash 1400ms ease-out;
      border-radius: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .translate-flash {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="dialog-root">
    <header class="dialog-header">
      <div>
        <h1 id="dialog-title" class="dialog-title">AI Result</h1>
        <p id="dialog-meta" class="dialog-meta">Waiting for content...</p>
      </div>
      <div class="dialog-actions">
        <button id="copy-button" class="dialog-button" type="button">Copy</button>
        <button id="close-button" class="dialog-button" type="button">Close</button>
      </div>
    </header>

    <main class="dialog-content">
      <div id="dialog-notes" class="dialog-notes" hidden></div>
      <p id="dialog-subject" class="dialog-subject" hidden></p>
      <section id="dialog-markup" class="dialog-markup">
        <p>No content yet.</p>
      </section>
      <span id="dialog-status" class="dialog-status"></span>
    </main>
  </div>
</body>

</html>
