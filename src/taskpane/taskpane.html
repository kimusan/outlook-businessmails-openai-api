<!doctype html>
<html lang="en" data-framework="typescript">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self' 'unsafe-inline' https://static2.sharepointonline.com; font-src 'self' https://static2.sharepointonline.com data:; img-src * data: blob:; connect-src *; frame-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Boot diagnostics: ES5 probe that reports startup failures in the
         placeholder. Must load before office.js and the bundle. -->
    <script src="./boot-report.js"></script>

    <title>Outlook AI Assistant by Kim Schulz</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link rel="stylesheet" href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/11.0.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-Fabric">
    <div id="container">
        <!-- Boot placeholder: replaced by React on mount. If it stays visible,
             the bundle never ran or Office.onReady never fired. -->
        <div class="boot-placeholder">
            <div class="boot-title">Outlook AI Assistant</div>
            <div class="boot-status" id="boot-status">Loading&hellip;</div>
        </div>
    </div>
</body>

</html>
